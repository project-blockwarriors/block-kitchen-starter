name: Check kitchen agent
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3.12 --version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run submission -- HEAD
      - name: Practice the committed agent
        run: npm run practice -- --ref HEAD --seconds 10 --out practice-runs/ci
      - name: Save practice replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kitchen-practice
          path: practice-runs/ci/
          if-no-files-found: ignore
          retention-days: 7
